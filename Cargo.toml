[package]
name = "blend-liquidator"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "GPL-3.0-only"
repository = "https://github.com/Templar-Protocol/blend-liquidator"
description = "Liquidation bot for Blend Protocol lending pools on Stellar"

# Standalone crate: an empty workspace table stops Cargo from adopting any
# enclosing workspace, wherever this repo happens to be checked out.
[workspace]

[lib]
path = "src/liquidator.rs"

[[bin]]
name = "liquidator"
path = "src/main.rs"

# Deliberately minimal. Every dependency here is used; the Stellar/Soroban
# stack arrives with the code that needs it, not before, so that
# `cargo deny`'s license and advisory surface stays honest about what this
# crate actually builds.
[dependencies]
# The /healthz, /livez and /metrics server. No default features: this crate
# uses no JSON/form/query extractor and no WebSocket support, only routing
# and plain-text responses over HTTP/1, so `http1` and `tokio` are the whole
# feature surface — and it keeps the licence tree what `deny.toml` already
# allows rather than pulling in whatever the defaults bring along.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
# Ed25519 signing of transaction hashes.
ed25519-dalek = "3.0"
# 256-bit integers for the fixed-point widening path. Already in the tree
# through stellar-xdr, so this adds no new code to audit.
ethnum = "1.5"
# Cadence phase offsets, so several bots on one pool do not fire on the
# same ledger.
rand = "0.10"
# JSON-RPC over HTTPS to the Soroban RPC. rustls with the system root store:
# the runtime image ships ca-certificates, and this is the feature set whose
# licence tree cargo-deny accepts — `rustls-tls` would pull webpki-roots
# (CDLA-Permissive-2.0) and 0.13's `rustls` routes through aws-lc-rs
# (OpenSSL licence), neither of which deny.toml allows.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Network id is sha256(passphrase). Already in the tree through stellar-xdr.
sha2 = "0.11"
# Postgres with compile-time checked queries. rustls with the system root
# store and the ring backend: the same TLS posture as `reqwest` above, and
# the feature set whose licence tree `cargo deny` accepts — the aws-lc-rs
# backends are OpenSSL-licensed and `deny.toml` does not allow that.
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "macros",
    "migrate",
    "json",
] }
# Decodes an S… secret. The version stellar-xdr already depends on, so no
# second copy; public keys parse through stellar-xdr's own FromStr impls.
# Bump it only with stellar-xdr: Dependabot ignores it, and
# scripts/check-repo-invariants.sh fails on a second copy in Cargo.lock.
stellar-strkey = "0.0.13"
# XDR types plus base64 for RPC payloads. No `soroban-sdk`: the handful of
# pool types the bot touches are encoded and decoded by hand in
# `chain::xdr`, which keeps every ScVal shape visible in one place.
stellar-xdr = { version = "28.0.0", features = ["base64"] }
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = ["full"] }
# The pools file.
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
# The scripted JSON-RPC server the chain tests drive the real client through.
wiremock = "0.6"

# Set before there is code to lint, which is the cheap moment: retrofitting
# `unwrap_used = "deny"` onto an existing codebase is not. Tests are exempted
# through clippy.toml's allow-unwrap-in-tests, never by relaxing this.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
large_futures = "allow"
redundant_closure_for_method_calls = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "warn"
large_digit_groups = "warn"
wildcard_imports = "allow"
doc_markdown = "allow"
result_large_err = "allow"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
debug = false
panic = "abort"
strip = "symbols"
overflow-checks = true
