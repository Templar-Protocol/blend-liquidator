[licenses]
# The allow-list is deliberately wider than this crate's current (tiny)
# dependency tree, so that routine additions do not each need a deny.toml edit
# to review. That means most entries match nothing today, which cargo-deny
# reports as `license-not-encountered` on every run — a warning that trains
# people to ignore warnings. Silenced here rather than by narrowing the list
# to today's five licenses, which would turn every future dependency into a
# CI failure that says nothing useful.
unused-allowed-license = "allow"
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "CC0-1.0", "GPL-3.0-only", "MPL-2.0", "BSL-1.0",
    # MIT minus the attribution requirement — strictly more permissive than
    # the MIT already allowed.
    "MIT-0",
]

[advisories]
yanked = "warn"
# No ignores. The dependency tree is currently small enough that every
# advisory is actionable; add an entry here only with the reasoning for WHY
# the advisory is unreachable — the path that pulls it in, and the command
# that proves it is absent from the release binary (`cargo tree -e normal -i
# <crate>`) — never a bare id.
ignore = []

[bans]
multiple-versions = "allow"

[sources]
# Fail closed on any git dependency, so a transitive git source cannot slip in
# unreviewed. There are none today; add one here deliberately when a
# dependency change legitimately introduces it.
unknown-git = "deny"
allow-git = []
