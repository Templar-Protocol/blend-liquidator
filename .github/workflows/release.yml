name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Fail the release BEFORE anything is published. Every check in the script
  # guards a failure that is silent rather than loud — a mislabelled image, a
  # stale lock that only breaks inside the Docker build, a release with no
  # changelog entry. Cheap, and it runs first because `image` needs it.
  # Runnable locally: ./scripts/check-release.sh vX.Y.Z
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-release.sh "${GITHUB_REF_NAME}"

  image:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          # Whether the package is public is its own GHCR setting, not this
          # repository's visibility, and nothing here sets it. While it is
          # private, pulling needs a token with `read:packages`
          # (docs/deploy.md, docs/deployment-contract.md).
          images: ghcr.io/templar-protocol/blend-liquidator
          # `latest=auto` only moves :latest for a non-prerelease semver tag —
          # an unconditional raw tag would repoint :latest at a release
          # candidate. The {{major}}.{{minor}} tag is guarded for the same
          # reason: metadata-action does not exclude prereleases from it.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # The same test the image tags use: a `-` suffix (`v0.2.0-rc.1`)
          # is a prerelease, which GitHub then never shows as the latest
          # release — the Release page agrees with `:latest`.
          prerelease: ${{ contains(github.ref_name, '-') }}
