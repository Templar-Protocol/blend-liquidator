name: Dev container

# Builds the dev container image whenever its definition changes.
#
# This exists because of a real failure in a sibling repository: the
# docker-in-docker feature sat pinned at a 2022 version whose install script
# runs `pip3 install --user pipx` against the system Python. Debian bookworm
# refuses that under PEP 668, so every Apple Silicon rebuild died while amd64
# hosts stayed green — and nothing in CI ran the dev container at all.
#
# AMD64 ONLY, and that is a real loss worth stating rather than hiding: free
# arm64 runners are a public-repository benefit and this repository is private,
# so the arm64 leg would bill. The failure above was arm64-exclusive, which is
# precisely what this job can no longer catch. Add `ubuntu-24.04-arm` back to
# the matrix if this repository goes public, or if the cost is acceptable.
#
# Deliberately NOT part of ci.yml's `CI Summary` gate: that gate treats a
# skipped job as a failure precisely because nothing there is path-filtered,
# and this workflow is path-filtered. Keeping it separate preserves that
# invariant. It is advisory — wire it into the ruleset if you want it blocking.
#
# `devcontainer build` only builds the image (base + features). It does not run
# postCreateCommand, so this does not exercise the toolchain or tooling
# installs. It answers "does the container build", which is the failure it was
# written for.

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  # Feature versions are pinned, so they only rot with time rather than with
  # commits — a monthly run surfaces an upstream break before someone hits it
  # mid-task on a rebuild.
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

jobs:
  build:
    name: build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build
        run: devcontainer build --workspace-folder .

      # The lock file pins each feature to a content digest. If a build
      # resolves something the committed lock does not describe, the pin has
      # drifted and the commit no longer says what will actually be installed.
      - name: Check devcontainer-lock.json is up to date
        run: |
          if ! git diff --exit-code -- .devcontainer/devcontainer-lock.json; then
            echo "::error::devcontainer-lock.json changed during the build — commit the updated lock file."
            exit 1
          fi
