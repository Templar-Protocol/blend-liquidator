# Pools this bot follows.
#
# One [[pools]] table per pool. Give this file's path as POOLS_FILE, or its
# contents inline as POOLS_TOML for an environment with no volume to mount
# (see .env.example) — never both.
#
# This example follows one real mainnet pool with XLM as the primary asset:
# the collateral the bot accumulates from fills and keeps a floor of.

[[pools]]
# The pool contract.
address = "CAJJZSGMMM3PD7N33TAPHGBUGTB43OC73HVIK2L2G6BNGGGYOSSYBXBD"

# The asset the bot keeps as collateral in this pool. Startup validation
# requires it to be a reserve with a positive collateral factor.
primary_asset = "CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2EVH34XOWMA" # XLM

# The least of the primary asset to hold, in its own decimals as a decimal
# string (XLM has 7: this is 100,000 XLM). In live mode, the filler holding
# less than this in a configured pool is a startup warning, not a failure.
min_primary_collateral = "1000000000000"

# The health factor the filler keeps its own position above after a fill.
# Decimal text, parsed into 7-decimal fixed point at startup.
#
# Must be strictly above 1.00001, the contract's own post-submit minimum:
# at or under it the filler would plan fills the contract refuses as
# InvalidHf, every one of them a wasted simulation and re-plan. The floor a
# plan actually holds is this times HF_SAFETY_MULTIPLIER (see .env.example),
# so the margin above the contract's minimum is the product of the two.
min_health_factor = 1.5

# Profit required when none of the [[pools.profits]] rules below match, in
# basis points.
default_profit_bps = 1000

# Cap how long this pool's fills wait, rather than letting fill_objective
# below decide alone. An auction's lot ramps up over its first 200 ledgers
# and its bid ramps down to nothing over the next 200; there is no cutoff
# after that — the contract will still take a fill at ledger 500 or 5,000 —
# so force_fill's only effect is a cap on the target: the filler aims no
# later than 350 ledgers into the auction, however little the lot covers by
# then, whichever ledger fill_objective would otherwise have picked. It is
# not a deadline: an auction the filler first sees after ledger 350 is
# filled at the first ledger it can still act in.
#
# It does not waive the health check — a fill is a position takeover, and
# min_health_factor above still binds every plan. For exercising a pool's
# wiring end to end, not for production: the 350-ledger cap is the one
# thing that will take a fill at whatever the lot covers by then.
force_fill = false

# Which ledger a fill aims at, before force_fill's cap (if any) is applied.
# An auction's bid ramps down to nothing by its 400th ledger, and from there
# the contract does not merely price it at zero: the bid is absent, so the
# filler takes the whole lot and assumes no liability at all. There is no
# cutoff after that ledger — the contract will still accept a fill at 500 or
# 5,000 — only nothing further to gain by waiting past it.
#
# "free-fill" (the default) waits for that ledger: the most the auction can
# pay, at the price of being the last to get it — anyone willing to pay a
# real bid can fill first, so this is a bet that nothing else is watching
# this pool. "earliest-profitable" instead fills at the first ledger the lot
# covers the bid plus default_profit_bps (or the matching rule below): less
# profit per fill, but the fill actually happens where competition for the
# auction is real.
fill_objective = "free-fill"

# Assets the bot will pay as the auction's bid, or ["*"] for any reserve.
# Every entry here must be a reserve of the pool.
supported_bid = [
  "CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2EVH34XOWMA", # XLM
  "CCW67TSZV3SSS2HXMBQ5JFGCKJNXKZM7UQUWUZPUTHXSTZLEO7SJMI75", # USDC
]

# Assets the bot will take as the auction's lot, or ["*"] for any reserve.
supported_lot = ["*"]

# Ordered profit rules; the first whose bid and lot lists both match a
# candidate auction wins over default_profit_bps above. Optional, and may
# be repeated.
[[pools.profits]]
profit_bps = 500
supported_bid = ["CCW67TSZV3SSS2HXMBQ5JFGCKJNXKZM7UQUWUZPUTHXSTZLEO7SJMI75"] # USDC
supported_lot = ["*"]
