# A static seed of tracked accounts, for a pool or network the analytics API
# (SEED_URL) does not cover, or as a supplement to it.
#
# One [accounts] table, keyed by pool address, each holding the list of
# accounts to seed for that pool. Give this file's path as SEED_FILE (see
# .env.example). Every account here is re-read and re-valued from chain
# before the bot trusts it, so a stale or wrong entry costs nothing beyond
# one extra chain read — it can never cause an incorrect submission.

[accounts]
# Precept - deJAAA/USDC, and one of its borrowers.
"CBH2ITLUBJ7H5A4ZZOWCUJ6LSXSDVN3LAMKVJ3JWIQ6TT5YCYVNA2LDH" = [
  "GAUD6X3PUFUCF2ZPEUVMZ5BW3SQZXOM36KUONBBHKJW763WPOAUY2TM5",
]
